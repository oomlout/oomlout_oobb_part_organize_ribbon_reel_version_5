      source: "// Print with the ribbon face on Z=0. All dimensions in millimetres.\n\
        module square_section(w, r) {\n    offset(r=r, $fn=48) square([w-2*r,w-2*r],center=true);\n\
        }\nmodule slab(w,r,z,h) {\n    translate([0,0,z]) linear_extrude(h) square_section(w,r);\n\
        }\n// Constant corner centres give true 45-degree flanks.\nmodule taper(w1,r1,w2,r2,z,h)\
        \ {\n    hull() {\n        slab(w1,r1,z,0.001);\n        slab(w2,r2,z+h-0.001,0.001);\n\
        \    }\n}\n// The feet are the standard three-stage male profile, measured\
        \ from the web.\nmodule plug_foot(web) {\n    taper(41.5,3.75,37.2,1.6,web,2.15);\n\
        \    slab(37.2,1.6,web+2.15,1.8);\n    taper(37.2,1.6,35.6,0.8,web+3.95,0.8);\n\
        }\n// A single perimeter lip captures only the tip of the mating feet.\nmodule\
        \ top_rim(n,web) {\n    w=n*42-0.5;\n    difference() {\n        slab(w,3.75,web,1.6);\n\
        \        taper(n*42-5.7,1.15,n*42-4.3,1.85,web,0.7);\n        slab(n*42-4.3,1.85,web+0.7,1);\n\
        \    }\n}\nmodule gridfinity_end(n=2,side=\"plug\",web=1) {\n    assert(n==2\
        \ || n==3);\n    assert(side==\"plug\" || side==\"socket\");\n    w=n*42-0.5;\n\
        \    cut=web+5;\n    difference() {\n        union() {\n            slab(w,3.75,0,web);\n\
        \            if (side==\"plug\")\n                for (i=[0:n-1],j=[0:n-1])\n\
        \                    translate([42*(i-(n-1)/2),42*(j-(n-1)/2),0]) plug_foot(web);\n\
        \            else top_rim(n,web);\n        }\n        translate([0,0,-0.1])\
        \ cylinder(d=17,h=cut+0.2,$fn=80);\n        for(x=[-15,15],y=[-15,15]) translate([x,y,-0.1])\n\
        \            cylinder(d=6.5,h=cut+0.2,$fn=64);\n        // Seat screws flush\
        \ with the web on either face of the core.\n        for(a=[0:90:270],s=[-1,1])\
        \ rotate([0,0,a]) translate([15,s*7.5,0]) {\n            translate([0,0,-0.1])\
        \ cylinder(d=3.4,h=cut+0.2,$fn=48);\n            translate([0,0,web-1.6])\
        \ cylinder(d1=3.2,d2=6.4,h=1.6,$fn=48);\n            translate([0,0,web])\
        \ cylinder(d=6.4,h=5,$fn=48);\n        }\n        j=w/2-12;\n        translate([22,-0.75,-0.1])\
        \ cube([w/2-21,1.5,cut+0.2]);\n        // Half of this diamond opens to the\
        \ edge, making a 5 mm lead-in.\n        for(x=[j,w/2]) translate([x,0,-0.1])\
        \ linear_extrude(cut+0.2)\n            polygon([[-2.5,0],[0,-2.5],[2.5,0],[0,2.5]]);\n\
        \        translate([j-0.75,0,-0.1]) cube([1.5,min(30,w/2-12),cut+0.2]);\n\
        \    }\n}\n"
      type: positive
